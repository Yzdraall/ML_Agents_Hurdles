# Unified mlagents-learn configuration (mlagents 1.1.0).
# Usage: mlagents-learn config/hurdles.yaml --run-id=hurdles_v2

default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 2048
    buffer_size: 20480
    learning_rate: 3.0e-4
    beta: 5.0e-3
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
    learning_rate_schedule: linear
  network_settings:
    normalize: true
    hidden_units: 512
    num_layers: 3
  reward_signals:
    extrinsic:
      gamma: 0.995
      strength: 1.0
  time_horizon: 1000
  summary_freq: 50000
  keep_checkpoints: 5
  max_steps: 100000000

behaviors:
  HurdleWalker:
    max_steps: 100000000
  HurdleCrawler:
    max_steps: 100000000

# Curriculum: value = FRACTION of the real hurdle height (0 = no hurdles, 1.0 = real height).
# Reward scale: per-step reward <= 0.01, hurdle cleared +0.5, finish +10, fall -1.
# WalkerHurdleAgent reads `walker_hurdle_height`, CrawlerHurdleAgent reads `crawler_hurdle_height`.
environment_parameters:
  walker_hurdle_height:
    curriculum:
      - name: Flat
        completion_criteria:
          measure: reward
          behavior: HurdleWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 0.0
      - name: Low
        completion_criteria:
          measure: reward
          behavior: HurdleWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 5.0
        value: 0.3
      - name: Medium
        completion_criteria:
          measure: reward
          behavior: HurdleWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 7.0
        value: 0.7
      - name: Real
        value: 1.0
  crawler_hurdle_height:
    curriculum:
      - name: Flat
        completion_criteria:
          measure: reward
          behavior: HurdleCrawler
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 0.0
      - name: Low
        completion_criteria:
          measure: reward
          behavior: HurdleCrawler
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 5.0
        value: 0.3
      - name: Medium
        completion_criteria:
          measure: reward
          behavior: HurdleCrawler
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 7.0
        value: 0.7
      - name: Real
        value: 1.0

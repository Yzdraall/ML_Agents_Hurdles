# Unified mlagents-learn configuration (mlagents 1.1.0).
# Usage (Editor):     mlagents-learn config/hurdles.yaml --run-id=hurdles_v3
# Usage (Standalone): mlagents-learn config/hurdles.yaml --run-id=hurdles_v3 --env=Build/Hurdles.exe --num-envs=4 --no-graphics

default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 4096
    buffer_size: 40960
    learning_rate: 3.0e-4
    beta: 5.0e-3
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
    learning_rate_schedule: linear
  network_settings:
    normalize: true
    hidden_units: 512
    num_layers: 3
  reward_signals:
    extrinsic:
      gamma: 0.995
      strength: 1.0
  time_horizon: 1000
  summary_freq: 20000
  keep_checkpoints: 10
  max_steps: 100000000

behaviors:
  HurdleWalker:
    max_steps: 100000000
  HurdleCrawler:
    max_steps: 100000000

# Curriculum: value = FRACTION of the full hurdle height above the track surface (0 = flat sprint).
# Reward budget: full forward progress +15, hurdles cleared up to +3.5, finish +10..+20, fall/stall -1.
# Thresholds (14 / 18 / 22) ensure agents traverse/finish the track before raising hurdles.
# Crawler tops out at 0.55 (~0.41 m to 1.43 m) to match quadruped leg height (2x scale).
environment_parameters:
  walker_hurdle_height:
    curriculum:
      - name: Flat
        completion_criteria:
          measure: reward
          behavior: HurdleWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 14.0
        value: 0.0
      - name: Low
        completion_criteria:
          measure: reward
          behavior: HurdleWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 18.0
        value: 0.35
      - name: Medium
        completion_criteria:
          measure: reward
          behavior: HurdleWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 22.0
        value: 0.70
      - name: Real
        value: 1.0
  crawler_hurdle_height:
    curriculum:
      - name: Flat
        completion_criteria:
          measure: reward
          behavior: HurdleCrawler
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 14.0
        value: 0.0
      - name: Low
        completion_criteria:
          measure: reward
          behavior: HurdleCrawler
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 18.0
        value: 0.20
      - name: Medium
        completion_criteria:
          measure: reward
          behavior: HurdleCrawler
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 22.0
        value: 0.40
      - name: Real
        value: 0.55
